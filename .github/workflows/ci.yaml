# =============================================================================
# CloudKitchen CI/CD — build, scan, push, and GitOps-update
# -----------------------------------------------------------------------------
# Pipeline overview:
#   build        : matrix over all 9 services → docker build, Trivy scan
#                  (fail on HIGH/CRITICAL), push to ECR (tags: <sha>, latest).
#   update-gitops: on push to main only → bump the image string for each
#                  service in helm/cloudkitchen/values.yaml and commit it back.
#                  ArgoCD (not this pipeline) performs the actual deployment.
#
# This pipeline NEVER runs `helm upgrade` or `kubectl apply` — deployment is
# strictly ArgoCD's responsibility. The only "deploy" action here is the git
# commit of updated image tags.
# =============================================================================
name: CI (AWS / ECR)

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - "user-service/**"
      - "restaurant-service/**"
      - "menu-service/**"
      - "order-service/**"
      - "payment-service/**"
      - "delivery-service/**"
      - "notification-service/**"
      - "frontend/**"
      - "helm/cloudkitchen/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "auth-service/**"
      - "user-service/**"
      - "restaurant-service/**"
      - "menu-service/**"
      - "order-service/**"
      - "payment-service/**"
      - "delivery-service/**"
      - "notification-service/**"
      - "frontend/**"
      - "helm/cloudkitchen/**"
      - ".github/workflows/ci.yaml"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Repository-/org-level values are read from GitHub "Variables" (vars.*) and
# "Secrets" (secrets.*). See the list at the bottom of this file.
env:
  AWS_REGION: us-east-1
  # ECR registry host: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  # All images live under the cloudkitchen-dev/ ECR namespace.
  IMAGE_PREFIX: cloudkitchen-dev

jobs:
  # ===========================================================================
  # build: build, scan and push every service image IN PARALLEL via a matrix.
  # ===========================================================================
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # source-dir          → ECR repo short name
          - service: auth-service
            ecr_name: auth
          - service: user-service
            ecr_name: user
          - service: restaurant-service
            ecr_name: restaurant
          - service: menu-service
            ecr_name: menu
          - service: order-service
            ecr_name: order
          - service: payment-service
            ecr_name: payment
          - service: delivery-service
            ecr_name: delivery
          - service: notification-service
            ecr_name: notification
          - service: frontend
            ecr_name: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally first so Trivy can scan before any push
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.ecr_name }}:${{ steps.vars.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.ecr_name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.ecr_name }}:${{ steps.vars.outputs.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # Push only on main (PRs still build + scan as a quality gate)
      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.ecr_name }}:${{ steps.vars.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.ecr_name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  # ===========================================================================
  # update-gitops: bump image strings in helm/cloudkitchen/values.yaml + commit.
  # ===========================================================================
  update-gitops:
    name: update-gitops
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update image tags in helm/cloudkitchen/values.yaml
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          FILE="helm/cloudkitchen/values.yaml"

          # source-dir → (values-key, ecr-short-name)
          # values keys remain camelCase (authService, userService, …)
          declare -A MAP=(
            [auth-service]="authService:auth"
            [user-service]="userService:user"
            [restaurant-service]="restaurantService:restaurant"
            [menu-service]="menuService:menu"
            [order-service]="orderService:order"
            [payment-service]="paymentService:payment"
            [delivery-service]="deliveryService:delivery"
            [notification-service]="notificationService:notification"
            [frontend]="frontend:frontend"
          )

          for svc in "${!MAP[@]}"; do
            IFS=':' read -r key ecr_name <<< "${MAP[$svc]}"
            img="${ECR_REGISTRY}/${IMAGE_PREFIX}/${ecr_name}:${NEW_TAG}"
            echo "Setting .${key}.image = ${img}"
            yq -i ".${key}.image = \"${img}\"" "$FILE"
          done

          echo "----- resulting $FILE -----"
          cat "$FILE"

      - name: Commit & push GitOps update
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "cloudkitchen-ci[bot]"
          git config user.email "ci-bot@cloudkitchen.example.com"

          if git diff --quiet -- helm/cloudkitchen/values.yaml; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git add helm/cloudkitchen/values.yaml
          git commit -m "ci(gitops): bump image tags to ${NEW_TAG} [skip ci]"
          git push origin main
